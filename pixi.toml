[workspace]
authors = ["TelegramMail contributors"]
channels = ["conda-forge"]
name = "telegramail"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
version = "0.2.0"

[tasks]
dev = "python -m app.main"
i18n = "python scripts/check_i18n.py"
test = 'python -m unittest discover -s tests -p "test_*.py"'
test-v2-config = 'python -m unittest discover -s tests -p "test_v2_config*.py"'

[dependencies]
python = "3.12.*"
pip = "*"

[pypi-dependencies]
beautifulsoup4 = "==4.14.3"
cryptography = "==45.0.6"
fastapi = "==0.116.1"
html2text = "==2025.4.15"
httpx = "==0.28.1"
json-repair = "==0.56.0"
markdown-it-py = "==4.0.0"
openai = "==2.16.0"
pydantic = "==2.12.5"
python-multipart = "==0.0.20"
python-dotenv = "==1.2.1"
uvicorn = { version = "==0.35.0", extras = ["standard"] }
